<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orb Spire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0e0b16;color:#f3eefc;font-family:system-ui,sans-serif;overscroll-behavior:none}
#app{height:100%;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:8px;padding:6px 10px}
header b{font-size:15px}
#best{font-size:12px;color:#9a90b5;margin-right:auto}
button{font:inherit;font-size:13px;color:#f3eefc;background:#2a2340;border:1px solid #4a3f6e;border-radius:8px;padding:6px 12px;cursor:pointer}
button.go{background:#f0b429;border-color:#f0b429;color:#201600;font-weight:700}
button:disabled{opacity:.4}
#stage{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:0 8px 6px;position:relative;background:linear-gradient(#171129,#241a3d)}
.foe{flex:1;max-width:130px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-height:0;position:relative}
.foe.boss{max-width:230px}
.foe svg{flex:1;min-height:0;width:100%;max-height:150px}
.foe .cd{font-size:12px;font-weight:700}
.foe.dead{visibility:hidden}
.foe.hit svg{animation:hit .3s}
.foe.atk svg{animation:atk .35s}
.foe.target::after{content:"▼ target";position:absolute;top:2px;font-size:11px;color:#ffd35a}
@keyframes hit{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes atk{50%{transform:translateY(12px) scale(1.12)}}
.bar{width:100%;height:8px;background:#000a;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .3s}
.pop{position:absolute;font-weight:800;font-size:20px;text-shadow:0 2px 3px #000;pointer-events:none;animation:rise .8s forwards;z-index:3;white-space:nowrap}
@keyframes rise{to{transform:translateY(-34px);opacity:0}}
#msg{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:22px;font-weight:800;color:#ffd35a;text-shadow:0 2px 4px #000;pointer-events:none;z-index:2}
#hpwrap{position:relative;height:18px;background:#000}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#e0457b,#ff8ab0);transition:width .3s}
#hptext{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:700;line-height:18px;text-shadow:0 1px 2px #000}
#team{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px}
.hero{padding:4px 0;border-width:2px;line-height:1.25}
.hero strong{display:block;font-size:13px}
.hero small{font-size:11px;color:#b9b0d4}
.hero.ready{box-shadow:0 0 0 2px #ffd35a}
.hero.ready small{color:#ffd35a;font-weight:700}
#timer{height:6px;background:#000}
#timer i{display:block;height:100%;width:0;background:#6ee7a8}
canvas{display:block;touch-action:none;margin:0 auto}
.sheet{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.sheet.on{display:flex}
.box{background:#1d1730;border:1px solid #4a3f6e;border-radius:14px;padding:16px;width:100%;max-height:100%;display:flex;flex-direction:column;gap:10px}
.box h2{font-size:19px}
.box p,.box li{font-size:14px;line-height:1.5;color:#d5cdea}
.box ul{padding-left:18px}
.row{display:flex;gap:8px;justify-content:flex-end}
#logList{overflow:auto;display:flex;flex-direction:column;gap:4px}
#logList div{font-size:13px;background:#2a2340;border-radius:6px;padding:6px 8px;border-left:3px solid #4a3f6e}
#logList div.you{border-color:#6ee7a8}
#logList div.foeLog{border-color:#ff6b6b}

/* ===== polish: scene, enemies, heroes, effects ===== */
header{position:absolute;top:0;left:0;right:0;z-index:6;padding:8px 12px;background:linear-gradient(#0b0816d0,transparent);pointer-events:none}
header>*{pointer-events:auto}
header b{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
#best{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
header button{width:36px;height:36px;padding:0;border-radius:10px;background:#ffffff14;border:1px solid #ffffff26;font-size:16px;line-height:1}
#stage{background:linear-gradient(#0d0a1f 0%,#2a1650 58%,#4a2377 100%);padding:46px 8px 24px;overflow:hidden}
#scene{position:absolute;inset:0;pointer-events:none}
#scene i{position:absolute;display:block}
#scene .st{width:2px;height:2px;border-radius:50%;background:#fff}
#scene .moon{left:50%;top:9%;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff6ff 0,#e7c8ff 22%,#9a63e0 34%,#a35cff44 35%,#a35cff00 70%)}
#scene .tw{bottom:40px;background:#0a0716;opacity:.9}
#scene .tw1{left:5%;width:50px;height:34%;clip-path:polygon(0 22%,50% 0,100% 22%,100% 100%,0 100%)}
#scene .tw2{right:4%;width:58px;height:46%;clip-path:polygon(0 16%,50% 0,100% 16%,100% 100%,0 100%)}
#scene .spire{left:50%;bottom:40px;width:110px;height:68%;margin-left:-55px;background:linear-gradient(#1a1030,#0c0818);clip-path:polygon(50% 0,60% 16%,66% 16%,66% 38%,74% 38%,74% 100%,26% 100%,26% 38%,34% 38%,34% 16%,40% 16%)}
#scene .ground{left:0;right:0;bottom:0;height:44px;background:linear-gradient(#1b1032,#0a0716);border-top:2px solid #6b3fb866}
.foe{z-index:1;transition:opacity .35s,transform .35s,visibility 0s .35s}
.foe.dead{opacity:0;transform:translateY(14px) scale(.8)}
.foe .cd{font-size:11px;font-weight:700;letter-spacing:.1em;color:#e8e0ff;text-shadow:0 1px 3px #000}
.foe svg{position:relative;z-index:1;filter:drop-shadow(0 4px 6px #0008)}
.foe .art{flex:1;min-height:0;width:100%;max-height:150px;position:relative}
.foe .art svg{display:block;width:100%;height:100%;max-height:none}
.foe .aura{position:absolute;left:5%;right:5%;bottom:-8px;height:26px;border-radius:50%;opacity:.55;z-index:0}
.foe .chip{position:absolute;top:-6px;right:0;z-index:2;min-width:24px;text-align:center;background:#ff7a2f;color:#1a0a00;font-weight:900;font-size:12px;border-radius:12px;padding:2px 7px;box-shadow:0 0 10px #ff7a2f}
.foe .chip.warn{background:#ff3b4a;color:#fff;box-shadow:0 0 12px #ff3b4a;animation:warn .7s ease-in-out infinite alternate}
@keyframes warn{to{transform:scale(1.18)}}
.bar{height:9px;border:1px solid #ffffff2a;background:#000a}
.bar i{box-shadow:inset 0 2px 0 #ffffff55}
.foe.target::after{content:"\25BC";top:-4px;font-size:16px;color:#ffd35a;text-shadow:0 0 10px #ffd35a;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
@keyframes hit{25%{transform:translateX(-7px);filter:brightness(2.2)}75%{transform:translateX(7px)}}
.slash{position:absolute;left:5%;right:5%;top:38%;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px #fff;transform:rotate(-28deg) scaleX(0);animation:slash .3s forwards;pointer-events:none;z-index:3}
@keyframes slash{40%{transform:rotate(-28deg) scaleX(1);opacity:1}100%{transform:rotate(-28deg) scaleX(1);opacity:0}}
.pop{font-size:26px;font-weight:900;text-shadow:0 3px 0 #0009,0 0 14px currentColor}
#msg{top:20%;font-size:clamp(30px,12vw,50px);font-weight:900;font-style:italic;line-height:1;color:#ffd35a;text-shadow:0 0 22px #ff9a2f,0 4px 0 #8a4a00,0 6px 12px #000;z-index:4}
#msg small{display:block;margin-top:6px;font-size:14px;font-style:normal;letter-spacing:.3em;color:#fff;text-shadow:0 2px 6px #000}
.msgpop{animation:msgpop .28s ease-out}
@keyframes msgpop{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#stage.shake{animation:shake .3s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(3px,-2px)}}
#hpwrap{height:22px;background:#120a22;border-top:1px solid #ffffff18}
#hpfill{background:linear-gradient(90deg,#d62f6d,#ff8ab0);box-shadow:0 0 16px #ff5c9a88}
#hptext{line-height:22px;font-weight:800}
#team{gap:6px;padding:8px 8px 6px}
.hero{padding:6px 0 7px;border:1px solid #ffffff1a;border-radius:12px;background:linear-gradient(#1d1533,#130d24);position:relative}
.hero .por{display:flex;width:38px;height:38px;margin:0 auto 3px;border-radius:50%;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,var(--c),var(--d));box-shadow:inset 0 -6px 10px #0006,inset 0 4px 8px #fff5,0 0 10px var(--c)}
.hero strong{color:var(--c);font-size:11px}
.hero .pips{display:flex;gap:2px;justify-content:center;margin-top:4px}
.hero .pips i{width:7px;height:4px;border-radius:2px;background:#ffffff22}
.hero .pips i.on{background:var(--c)}
.hero.ready{border-color:#ffd35a;animation:glow 1s ease-in-out infinite alternate}
.hero.ready::after{content:"TAP";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#ffd35a;color:#241800;font-size:9px;font-weight:900;border-radius:8px;padding:1px 7px}
@keyframes glow{to{box-shadow:0 0 16px #ffd35a99}}
#timer{height:8px;margin:0 10px 2px;border-radius:5px;background:#000a;border:1px solid #ffffff22;overflow:hidden}
#timer i{border-radius:5px}
canvas{margin:6px auto 10px;border-radius:12px;box-shadow:0 0 0 2px #7a54c8,0 0 24px #7a54c855}
@media (prefers-reduced-motion:reduce){.hero.ready,.foe .chip.warn,.foe.target::after{animation:none}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#fx i{position:absolute;left:0;top:0;border-radius:50%;will-change:transform,opacity}
.hero.charge{animation:charge .28s ease-out}
@keyframes charge{40%{transform:scale(1.1);filter:brightness(1.7)}}
.hero.fire{animation:fire .3s ease-out}
@keyframes fire{35%{transform:translateY(-9px) scale(1.08);filter:brightness(1.8)}}
#hpwrap.charge{animation:hpcharge .28s ease-out}
@keyframes hpcharge{40%{filter:brightness(1.8)}}
</style>
</head>
<body>
<div id="app">
  <header><b id="floor">Floor 1</b><span id="best"></span><button id="logBtn" aria-label="Battle log">📜</button><button id="sndBtn" aria-label="Sound">🔊</button></header>
  <div id="stage"><div id="scene"><i class="moon"></i><i class="tw tw1"></i><i class="tw tw2"></i><i class="spire"></i><i class="ground"></i></div><div id="msg"></div></div>
  <div id="hpwrap"><div id="hpfill"></div><div id="hptext"></div></div>
  <div id="team"></div>
  <div id="timer"><i></i></div>
  <canvas id="board" aria-label="Orb board"></canvas>
  <div id="fx"></div>
  <div class="sheet" id="sheet"><div class="box" id="box"></div></div>
</div>
<script>
'use strict';
const COLS=6,ROWS=5,MOVE_TIME=6000;
const EL=[
 {n:'Fire', c:'#ff5a3c',d:'#8f1d0c'},
 {n:'Water',c:'#38a8ff',d:'#0b468f'},
 {n:'Wood', c:'#45cf62',d:'#11682a'},
 {n:'Light',c:'#ffd23a',d:'#8f6400'},
 {n:'Dark', c:'#b25cff',d:'#4a1389'},
 {n:'Heart',c:'#ff7fb6',d:'#a3245f'}];
const HEROES=[
 {n:'Ember',el:0,atk:110,cd:5,skill:'Turns every Heart orb into Fire.',run:()=>convert(5,0)},
 {n:'Tide', el:1,atk:100,cd:6,skill:'Restores 35% of team HP.',run:()=>heal(G.max*.35)},
 {n:'Briar',el:2,atk:100,cd:5,skill:'Turns every Dark orb into Wood.',run:()=>convert(4,2)},
 {n:'Sol',  el:3,atk:105,cd:7,skill:'Delays all enemy attacks by 2 turns.',run:()=>{G.foes.forEach(f=>f.cd+=2);drawFoes()}},
 {n:'Vex',  el:4,atk:115,cd:4,skill:'Gives 4 extra seconds on your next move.',run:()=>{G.bonus=4000}}];
const $=id=>document.getElementById(id);
(function(){const sc=document.getElementById('scene');for(let i=0;i<28;i++){const d=document.createElement('i');d.className='st';d.style.cssText=`left:${(Math.random()*98|0)+1}%;top:${(Math.random()*55|0)+2}%;opacity:${(.3+Math.random()*.6).toFixed(2)}`;sc.insertBefore(d,sc.firstChild)}})();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.random()*n|0;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let G,grid,busy=true,drag=null,sound=true,ac=null,best=+store.get('orbSpireBest')||0;

/* ---------- sound ---------- */
function beep(f,len=.09,type='triangle',vol=.12){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+len);
  }catch(e){}
}

/* ---------- board drawing ---------- */
const cv=$('board'),cx=cv.getContext('2d');
let S=60,dpr=1,sprites=[],frame=0,last=0;
function symbol(c,i,r){
  c.beginPath();
  if(i===0){c.moveTo(0,-r);c.bezierCurveTo(r*.2,-r*.4,r,-r*.1,r*.7,r*.5);c.bezierCurveTo(r*.4,r*1.1,-r*.4,r*1.1,-r*.7,r*.5);c.bezierCurveTo(-r,0,-r*.5,-r*.2,-r*.4,-r*.5);c.quadraticCurveTo(-r*.1,-r*.3,0,-r)}
  else if(i===1){c.moveTo(0,-r);c.bezierCurveTo(r*.3,-r*.5,r*.75,0,r*.75,r*.35);c.arc(0,r*.35,r*.75,0,Math.PI);c.bezierCurveTo(-r*.75,0,-r*.3,-r*.5,0,-r)}
  else if(i===2){c.moveTo(r*.85,-r*.85);c.quadraticCurveTo(r*.9,r*.8,-r*.65,r*.65);c.quadraticCurveTo(-r*.8,-r*.9,r*.85,-r*.85)}
  else if(i===3){for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,q=k%2?r*.45:r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q)}}
  else if(i===4){c.arc(0,0,r*.9,.35*Math.PI,1.65*Math.PI);c.bezierCurveTo(-r*.35,-r*.4,-r*.35,r*.4,r*.41,r*.8)}
  else{c.moveTo(0,r*.85);c.bezierCurveTo(-r*1.4,-r*.1,-r*.6,-r*1.15,0,-r*.4);c.bezierCurveTo(r*.6,-r*1.15,r*1.4,-r*.1,0,r*.85)}
  c.closePath();c.fill();
}
function makeSprites(){
  sprites=EL.map((e,i)=>{
    const s=document.createElement('canvas');s.width=s.height=Math.ceil(S*dpr);
    const c=s.getContext('2d');c.scale(dpr,dpr);c.translate(S/2,S/2);
    const r=S*.45,g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);
    g.addColorStop(0,'#fff');g.addColorStop(.25,e.c);g.addColorStop(1,e.d);
    c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();
    c.fillStyle='rgba(255,255,255,.9)';c.shadowColor=e.d;c.shadowBlur=4*dpr;symbol(c,i,S*.22);
    return s;
  });
}
function resize(){
  const w=Math.min($('app').clientWidth-12,Math.floor(innerHeight*.46*COLS/ROWS));
  S=Math.floor(w/COLS);dpr=Math.min(devicePixelRatio||1,2);
  cv.style.width=S*COLS+'px';cv.style.height=S*ROWS+'px';
  cv.width=S*COLS*dpr;cv.height=S*ROWS*dpr;
  makeSprites();redraw();
}
function redraw(){if(!frame){last=performance.now();frame=requestAnimationFrame(tick)}}
function tick(now){
  frame=0;const dt=Math.min(50,Math.max(0,now-last));last=now;let moving=false;
  cx.setTransform(dpr,0,0,dpr,0,0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){cx.fillStyle=(x+y)%2?'#2b2140':'#221a33';cx.fillRect(x*S,y*S,S,S)}
  if(grid)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const o=grid[y][x];if(!o)continue;
    const k=Math.min(1,dt/55);
    o.dx-=o.dx*k;o.dy-=o.dy*k;
    if(Math.abs(o.dx)<.01)o.dx=0;if(Math.abs(o.dy)<.01)o.dy=0;
    if(o.fade){o.a=Math.max(0,o.a-dt/220);if(o.a>0)moving=true}
    if(o.dx||o.dy)moving=true;
    cx.globalAlpha=drag&&drag.o===o?.3:o.a;
    cx.drawImage(sprites[o.t],(x+o.dx)*S,(y+o.dy)*S,S,S);
  }
  cx.globalAlpha=1;
  if(drag){
    const z=S*1.18;cx.drawImage(sprites[drag.o.t],drag.px-z/2,drag.py-z/2,z,z);
    if(drag.start){
      const left=Math.max(0,1-(now-drag.start)/drag.limit);
      const t=$('timer').firstChild;t.style.width=left*100+'%';t.style.background=left<.3?'#ff6b6b':'linear-gradient(90deg,#3ddc97,#9af0c4)';t.style.boxShadow='0 0 12px '+(left<.3?'#ff6b6b':'#3ddc97');
      if(left<=0)endDrag();else moving=true;
    }
  }
  if(moving)redraw();
}

/* ---------- input ---------- */
function point(e){
  const r=cv.getBoundingClientRect();
  return{x:Math.max(1,Math.min(S*COLS-1,e.clientX-r.left)),y:Math.max(1,Math.min(S*ROWS-1,e.clientY-r.top))};
}
cv.addEventListener('pointerdown',e=>{
  if(busy||drag)return;e.preventDefault();
  const p=point(e),x=p.x/S|0,y=p.y/S|0;
  cv.setPointerCapture(e.pointerId);
  drag={id:e.pointerId,x,y,o:grid[y][x],px:p.x,py:p.y,start:0,limit:MOVE_TIME+G.bonus};
  beep(330,.05);redraw();
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const p=point(e),ox=drag.px,oy=drag.py,steps=Math.ceil(Math.hypot(p.x-ox,p.y-oy)/(S*.15))||1;
  for(let i=1;i<=steps;i++){
    const px=ox+(p.x-ox)*i/steps,py=oy+(p.y-oy)*i/steps,x=px/S|0,y=py/S|0;
    /* round hit zone so diagonal moves don't clip side orbs */
    if((x!==drag.x||y!==drag.y)&&Math.hypot(px-(x+.5)*S,py-(y+.5)*S)<S*.46){
      while(drag.x!==x||drag.y!==y)swapTo(drag.x+Math.sign(x-drag.x),drag.y+Math.sign(y-drag.y));
    }
  }
  drag.px=p.x;drag.py=p.y;redraw();
});
function swapTo(x,y){
  const other=grid[y][x];
  other.dx+=x-drag.x;other.dy+=y-drag.y;
  grid[drag.y][drag.x]=other;grid[y][x]=drag.o;
  drag.x=x;drag.y=y;
  if(!drag.start)drag.start=performance.now();
  beep(520,.03,'sine',.07);
}
function release(e){if(drag&&e.pointerId===drag.id)endDrag()}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
function endDrag(){
  const moved=drag.start;drag=null;$('timer').firstChild.style.width='0';redraw();
  if(moved){G.bonus=0;playTurn()}
}

/* ---------- puzzle logic ---------- */
const orb=(t,dy=0)=>({t,dx:0,dy,a:1,fade:false});
function newGrid(){
  grid=[];
  for(let y=0;y<ROWS;y++){grid[y]=[];for(let x=0;x<COLS;x++){
    let t;do t=rnd(6);while((x>1&&grid[y][x-1].t===t&&grid[y][x-2].t===t)||(y>1&&grid[y-1][x].t===t&&grid[y-2][x].t===t));
    grid[y][x]=orb(t);
  }}
  redraw();
}
function findGroups(){
  const hit=new Set();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=grid[y][x].t;
    if(x<COLS-2&&grid[y][x+1].t===t&&grid[y][x+2].t===t)[0,1,2].forEach(i=>hit.add(y*COLS+x+i));
    if(y<ROWS-2&&grid[y+1][x].t===t&&grid[y+2][x].t===t)[0,1,2].forEach(i=>hit.add((y+i)*COLS+x));
  }
  const groups=[];
  while(hit.size){
    const first=hit.values().next().value,t=grid[first/COLS|0][first%COLS].t,cells=[first];hit.delete(first);
    for(let i=0;i<cells.length;i++){
      const c=cells[i],x=c%COLS,y=c/COLS|0;
      [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([a,b])=>{
        const k=b*COLS+a;
        if(a>=0&&a<COLS&&hit.has(k)&&grid[b][a].t===t){hit.delete(k);cells.push(k)}
      });
    }
    groups.push({t,cells});
  }
  return groups.sort((a,b)=>Math.max(...b.cells)-Math.max(...a.cells));
}
function drop(){
  for(let x=0;x<COLS;x++){
    const keep=[];
    for(let y=ROWS-1;y>=0;y--)if(!grid[y][x].fade)keep.push([grid[y][x],y]);
    const missing=ROWS-keep.length;
    for(let y=ROWS-1,i=0;y>=0;y--,i++){
      if(i<keep.length){const[o,from]=keep[i];o.dy+=from-y;grid[y][x]=o}
      else grid[y][x]=orb(rnd(6),-missing);
    }
  }
  redraw();
}
function convert(from,to){grid.flat().forEach(o=>{if(o.t===from){o.t=to;o.a=1;o.dy=-.25}});redraw()}

/* ---------- battle ---------- */
function advantage(a,d){
  if((a===0&&d===2)||(a===2&&d===1)||(a===1&&d===0)||(a===3&&d===4)||(a===4&&d===3))return 1.5;
  if((a===2&&d===0)||(a===1&&d===2)||(a===0&&d===1))return .5;
  return 1;
}
function log(text,cls=''){
  G.log.unshift({text:`F${G.floor} · ${text}`,cls});if(G.log.length>60)G.log.pop();
}
function pop(parent,text,color,x='50%',y='45%'){
  const d=document.createElement('div');d.className='pop';d.textContent=text;
  d.style.cssText=`color:${color};left:${x};top:${y};translate:-50% 0`;
  parent.appendChild(d);setTimeout(()=>d.remove(),800);
}
function heal(v){
  v=Math.round(Math.min(v,G.max-G.hp));G.hp+=v;drawHP();
  if(v>0){pop($('stage'),'+'+v,'#6ee7a8','50%','75%');log(`Healed ${v} HP`,'you')}
}
function drawHP(){
  $('hpfill').style.width=100*G.hp/G.max+'%';$('hptext').textContent=`Team HP ${Math.ceil(G.hp)} / ${G.max}`;
}
const GLYPH=['\u{1F525}','\u{1F4A7}','\u{1F343}','\u2726','\u263E'];
function drawTeam(){
  $('team').innerHTML='';
  HEROES.forEach((h,i)=>{
    const b=document.createElement('button'),left=G.skill[i],e=EL[h.el];
    b.className='hero'+(left?'':' ready');b.style.setProperty('--c',e.c);b.style.setProperty('--d',e.d);
    b.setAttribute('aria-label',h.n+(left?', skill in '+left:', skill ready'));
    let pips='';for(let k=0;k<h.cd;k++)pips+=`<i class="${k<h.cd-left?'on':''}"></i>`;
    b.innerHTML=`<span class="por">${GLYPH[h.el]}</span><strong>${h.n}</strong><span class="pips">${pips}</span>`;
    b.onclick=()=>showHero(i);$('team').appendChild(b);
  });
}
let monId=0;
function monster(f){
  const e=EL[f.el],s=f.shape,id='mg'+(monId++);
  const body=['M20 90Q10 35 50 30Q90 35 80 90Z','M50 18L85 55L70 92H30L15 55Z','M15 70Q15 30 50 30Q85 30 85 70L75 92L62 80L50 93L38 80L25 92Z'][s];
  const horns=f.boss?'M24 40L8 4L40 30ZM76 40L92 4L60 30ZM42 28L50 2L58 28Z':['M30 38L22 14L44 32ZM70 38L78 14L56 32Z','M18 55L2 38L28 44ZM82 55L98 38L72 44Z','M50 34L42 10L60 22Z'][s];
  return `<svg viewBox="0 0 100 96"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${e.c}"/><stop offset="1" stop-color="${e.d}"/></radialGradient></defs><path d="${horns}" fill="${e.d}" stroke="#0007" stroke-width="1.5"/><path d="${body}" fill="url(#${id})" stroke="${e.d}" stroke-width="3"/><ellipse cx="34" cy="44" rx="8" ry="3.5" fill="#fff" opacity=".45" transform="rotate(-28 34 44)"/><path d="M29 49L45 55Q40 66 31 60ZM71 49L55 55Q60 66 69 60Z" fill="#fff"/><circle cx="39" cy="58" r="3.4" fill="#10081c"/><circle cx="61" cy="58" r="3.4" fill="#10081c"/><path d="M36 72L43 78L50 72L57 78L64 72" fill="none" stroke="#1a0f24" stroke-width="3" stroke-linejoin="round"/></svg>`;
}
function spawn(){
  const n=G.floor,boss=n%5===0,count=boss?1:n===1?2:1+rnd(3);
  const total=700*Math.pow(1.14,n-1)*(boss?1.8:1),power=Math.pow(1.09,n-1);
  G.target=null;
  G.foes=Array.from({length:count},()=>{
    const hp=Math.round(total/count),cd=boss?2:2+rnd(2);
    return{el:rnd(5),shape:rnd(3),boss,hp,max:hp,cd:cd+(count>2?1:0),every:cd+(count>2?1:0),atk:Math.round((boss?460:300/Math.sqrt(count))*power)};
  });
  $('floor').textContent=`Floor ${n}${boss?' · BOSS':''}`;
  $('stage').querySelectorAll('.foe').forEach(d=>d.remove());
  G.foes.forEach((f,i)=>{
    const d=document.createElement('div');d.className='foe'+(boss?' boss':'');
    d.innerHTML=`<div class="art"><span class="chip"></span><div class="aura" style="background:radial-gradient(ellipse at center,${EL[f.el].c}cc,transparent 70%)"></div>${monster(f)}</div><div class="cd"></div><div class="bar"><i style="background:linear-gradient(90deg,${EL[f.el].d},${EL[f.el].c})"></i></div>`;
    d.onclick=()=>{if(f.hp<=0)return;G.target=G.target===f?null:f;drawFoes()};
    f.dom=d;$('stage').appendChild(d);
  });
  drawFoes();log(`${boss?'Boss':count+' enemies'} appeared`);
}
function drawFoes(){
  G.foes.forEach(f=>{
    f.dom.classList.toggle('dead',f.hp<=0);f.dom.classList.toggle('target',G.target===f&&f.hp>0);
    const c=f.dom.querySelector('.cd');
    c.textContent=EL[f.el].n.toUpperCase();const ch=f.dom.querySelector('.chip');ch.textContent=f.cd;ch.classList.toggle('warn',f.cd<=1);ch.title='Hits in '+f.cd;
    f.dom.querySelector('.bar i').style.width=100*Math.max(0,f.hp)/f.max+'%';
  });
}

/* ---------- orb break effects: orbs fly to their hero, hero shoots the enemy ---------- */
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
function ctr(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function heroEl(t){const i=HEROES.findIndex(h=>h.el===t);return i<0?null:$('team').children[i]}
function dot(c,size,glow){
  const d=document.createElement('i');d.style.width=d.style.height=size+'px';
  d.style.background=`radial-gradient(circle at 35% 30%,#fff,${c} 55%,${c}00 100%)`;
  d.style.boxShadow=`0 0 ${glow}px ${c}`;$('fx').appendChild(d);return d;
}
function flyOrbs(cells,t){
  if(REDUCE)return;
  const target=t===5?$('hpwrap'):heroEl(t);if(!target)return;
  const to=ctr(target),r=cv.getBoundingClientRect(),c=EL[t].c;
  cells.forEach((k,n)=>{
    const x=r.left+(k%COLS+.5)*S,y=r.top+((k/COLS|0)+.5)*S;
    const d=dot(c,Math.round(S*.34),12),mx=(x+to.x)/2+(x<to.x?-1:1)*30,my=Math.min(y,to.y)-30;
    const a=d.animate([
      {transform:`translate(${x-8}px,${y-8}px) scale(1.3)`,opacity:1},
      {transform:`translate(${mx-8}px,${my-8}px) scale(1)`,opacity:1,offset:.45},
      {transform:`translate(${to.x-8}px,${to.y-8}px) scale(.5)`,opacity:.9}],
      {duration:360,delay:n*35,easing:'cubic-bezier(.4,0,.8,.6)',fill:'both'});
    a.onfinish=()=>{d.remove();if(n===cells.length-1)flash(target,'charge')};
  });
}
function shoot(heroIdx,f){
  const card=$('team').children[heroIdx];
  if(REDUCE||!card||!f.dom)return Promise.resolve();
  flash(card,'fire');
  const from=ctr(card),art=f.dom.querySelector('.art')||f.dom,to=ctr(art),c=EL[HEROES[heroIdx].el].c;
  const d=dot(c,26,22);
  const a=d.animate([
    {transform:`translate(${from.x-13}px,${from.y-13}px) scale(.6)`,opacity:1},
    {transform:`translate(${(from.x+to.x)/2-13}px,${Math.min(from.y,to.y)-20}px) scale(1.2)`,opacity:1,offset:.5},
    {transform:`translate(${to.x-13}px,${to.y-13}px) scale(1.6)`,opacity:1}],
    {duration:260,easing:'ease-in',fill:'both'});
  return a.finished.then(()=>d.remove(),()=>d.remove());
}
function slash(f){const d=document.createElement('i');d.className='slash';f.dom.appendChild(d);setTimeout(()=>d.remove(),350)}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

async function playTurn(){
  busy=true;await sleep(120);
  let combos=0;const power=[0,0,0,0,0,0],wide=[];
  for(let groups=findGroups();groups.length;groups=findGroups()){
    for(const g of groups){
      combos++;power[g.t]+=1+.25*(g.cells.length-3);if(g.cells.length>=5)wide[g.t]=true;
      g.cells.forEach(k=>grid[k/COLS|0][k%COLS].fade=true);flyOrbs(g.cells,g.t);
      $('msg').innerHTML=combos+' COMBO!'+(combos>1?`<small>x${(1+.25*(combos-1)).toFixed(2)} DAMAGE</small>`:'');flash($('msg'),'msgpop');beep(300*Math.pow(1.09,Math.min(combos,16)),.14);
      redraw();await sleep(REDUCE?260:320);
    }
    drop();await sleep(300);
  }
  if(combos){
    const mult=1+.25*(combos-1),grow=1+.08*(G.floor-1);
    if(power[5])heal(180*power[5]*mult);
    for(let i=0;i<HEROES.length;i++){
      const h=HEROES[i];if(!power[h.el])continue;
      const alive=G.foes.filter(f=>f.hp>0);if(!alive.length)break;
      const base=h.atk*grow*power[h.el]*mult;
      let targets=alive;
      if(!wide[h.el]){
        targets=[G.target&&G.target.hp>0?G.target:alive.slice().sort((a,b)=>advantage(h.el,b.el)-advantage(h.el,a.el)||a.hp-b.hp)[0]];
      }
      await Promise.all(targets.map(f=>shoot(i,f)));
      let sum=0;
      for(const f of targets){
        const a=advantage(h.el,f.el),dmg=Math.round(base*a);f.hp-=dmg;sum+=dmg;
        flash(f.dom,'hit');slash(f);pop(f.dom,dmg+(a>1?'!':''),EL[h.el].c);
      }
      log(`${h.n} dealt ${sum}${wide[h.el]?' to all':''}`,'you');
      beep(150+h.el*40,.12,'square',.06);drawFoes();await sleep(300);
    }
    if(combos>=4){flash($('stage'),'shake');beep(60,.25,'sine',.2);buzz(25)}
    log(`${combos} combo (x${mult.toFixed(2)})`,'you');
  }else log('No match','you');
  G.skill=G.skill.map(v=>Math.max(0,v-1));drawTeam();
  await sleep(250);$('msg').textContent='';
  if(G.foes.every(f=>f.hp<=0))return nextFloor();
  for(const f of G.foes){
    if(f.hp<=0)continue;
    if(--f.cd<=0){
      f.cd=f.every;G.hp=Math.max(0,G.hp-f.atk);drawHP();flash(f.dom,'atk');
      pop($('stage'),'-'+f.atk,'#ff6b6b','50%','75%');log(`${EL[f.el].n} enemy hit you for ${f.atk}`,'foeLog');
      beep(90,.25,'sawtooth',.14);flash($('stage'),'shake');buzz(50);drawFoes();await sleep(450);
    }
    if(G.hp<=0)return gameOver();
  }
  drawFoes();busy=false;
}
async function nextFloor(){
  if(G.floor>best){best=G.floor;store.set('orbSpireBest',best);drawBest()}
  $('msg').textContent='Floor cleared!';beep(660,.15);await sleep(150);beep(880,.25);await sleep(850);
  $('msg').textContent='';G.floor++;heal(G.max*.25);spawn();busy=false;
}

/* ---------- sheets ---------- */
function sheet(html,buttons){
  $('box').innerHTML=html+'<div class="row"></div>';
  const row=$('box').querySelector('.row');
  buttons.forEach(([label,fn,cls,off])=>{
    const b=document.createElement('button');b.textContent=label;b.className=cls||'';b.disabled=!!off;
    b.onclick=()=>{$('sheet').classList.remove('on');fn&&fn()};row.appendChild(b);
  });
  $('sheet').classList.add('on');
}
function showHero(i){
  if(drag)return;
  const h=HEROES[i],left=G.skill[i];
  sheet(`<h2 style="color:${EL[h.el].c}">${h.n} · ${EL[h.el].n}</h2><p>${h.skill}</p><p>${left?`Ready in ${left} turn${left>1?'s':''}.`:'Ready now. Using it does not end your turn.'}</p>`,[
    ['Close'],
    ['Use skill',()=>{if(busy||G.skill[i])return;G.skill[i]=h.cd;h.run();log(`${h.n} used skill`,'you');drawTeam();beep(740,.2)},'go',left||busy]]);
}
function help(buttons){
  sheet(`<h2>Orb Spire</h2><ul>
  <li><b>Drag one orb</b> around the board. Others swap out of its way. You have 6 seconds.</li>
  <li>Line up <b>3 or more</b>. More combos means more damage.</li>
  <li>Match <b>5 connected</b> to hit all enemies. Hearts heal.</li>
  <li>Fire beats Wood, Wood beats Water, Water beats Fire. Light and Dark beat each other.</li>
  <li>Tap an enemy to target it. Tap a hero for skills.</li></ul>`,buttons);
}
function gameOver(){
  beep(70,.6,'sawtooth',.15);
  sheet(`<h2>Defeated on floor ${G.floor}</h2><p>Best floor cleared: ${best}</p>`,[['Play again',start,'go']]);
}
function drawBest(){$('best').textContent=best?'Best '+best:''}
function start(){
  G={floor:1,hp:2400,max:2400,skill:HEROES.map(h=>h.cd),bonus:0,log:[],foes:[],target:null};
  $('msg').textContent='';newGrid();spawn();drawHP();drawTeam();drawBest();busy=false;
}
$('logBtn').onclick=()=>{
  if(drag)return;
  sheet('<h2>Battle log</h2><div id="logList"></div>',[['How to play',()=>help([['Back to game',null,'go']])],['Close',null,'go']]);
  G.log.forEach(l=>{const d=document.createElement('div');d.className=l.cls;d.textContent=l.text;$('logList').appendChild(d)});
};
$('sndBtn').onclick=()=>{sound=!sound;$('sndBtn').textContent=sound?'\u{1F50A}':'\u{1F507}'};
addEventListener('resize',resize);
start();resize();help([['Start climbing',()=>beep(520,.1),'go']]);
</script>
</body>
