<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orb Spire</title>
<link rel="stylesheet" href="css/orbspire.css">
</head>
<body>
<div id="app">
  <header><b id="floor">Floor 1</b><span id="best"></span><span class="pill" id="goldPill">🪙 0</span><button id="heroBtn" aria-label="Home">🏠</button><button id="logBtn" aria-label="Battle log">📜</button><button id="sndBtn" aria-label="Sound">🔊</button></header>
  <div id="stage"><div id="scene"><i class="moon"></i><i class="tw tw1"></i><i class="tw tw2"></i><i class="spire"></i><i class="ground"></i></div><div id="msg"></div></div>
  <div id="hpwrap"><div id="hpfill"></div><div id="hptext"></div></div>
  <div id="team"></div>
  <div id="timer"><i></i></div>
  <canvas id="board" aria-label="Orb board"></canvas>
  <div id="fx"></div>
  <div class="scr" id="home"><div class="bar2" id="hbar"></div><div id="hbody"></div><div id="hfoot"></div><nav id="nav"><button data-t="map"><i>🗺️</i>MAP</button><button data-t="heroes"><i>🧙</i>HEROES</button><button data-t="spire"><i>🗼</i>SPIRE</button></nav></div>
  <div class="sheet" id="sheet"><div class="box" id="box"></div></div>
</div>
<script src="js/data.js"></script>
<script src="js/orbspire.js"></script>
</body>
</html>
